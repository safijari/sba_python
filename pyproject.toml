[build-system]
requires = ["setuptools>=42", "wheel", "pybind11-cmake>=2.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse_bundle_adjustment"
version = "0.9.6"
description = "Python bindings for Sparse Bundle Adjustment library"
readme = "README.org"
requires-python = ">=3.11"
license = {text = "BSD"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/safijari/sba_python"
Repository = "https://github.com/safijari/sba_python"

[tool.setuptools]
# The package is a pure extension module, no Python packages to discover
zip-safe = false
